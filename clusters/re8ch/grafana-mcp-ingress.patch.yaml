apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: re8ch-grafana
  namespace: observability-system
spec:
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: toolhive-system
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: re8ch-grafana-renderer
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: re8ch-grafana-org-sync
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: tenant-infrastructure
      podSelector:
        matchLabels:
          app: tenant-provider-reconciler
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: grafana-mcp
