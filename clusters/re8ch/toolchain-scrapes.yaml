---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMServiceScrape
metadata:
  name: toolchain-connectool-gateway
  namespace: observability-system
  labels:
    observability.re8ch.com/managed: 'true'
spec:
  discoveryRole: endpointslice
  namespaceSelector:
    matchNames:
    - tenant-infrastructure
  selector:
    matchLabels:
      re8ch.com/metrics-surface: tenant-mcp
  endpoints:
  - port: catalog-mcp
    path: /metrics
    scheme: http
    interval: 30s
    scrapeTimeout: 20s
    relabelConfigs:
    - action: keep
      sourceLabels:
      - __meta_kubernetes_service_name
      regex: tenant-api
    - targetLabel: job
      replacement: toolchain-connectool-gateway
