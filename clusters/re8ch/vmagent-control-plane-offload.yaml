apiVersion: operator.victoriametrics.com/v1beta1
kind: VMAgent
metadata:
  name: re8ch
  namespace: observability-system
spec:
  tolerations:
    - {key: node-role.kubernetes.io/control-plane, operator: Exists, effect: NoSchedule}
    - {key: storage.re8ch.com/coordinator, operator: Equal, value: "true", effect: NoSchedule}
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - {key: kubernetes.io/hostname, operator: In, values: [b1-wsl-zt, r640]}
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          preference:
            matchExpressions:
              - {key: kubernetes.io/hostname, operator: In, values: [r640]}
        - weight: 80
          preference:
            matchExpressions:
              - {key: kubernetes.io/hostname, operator: In, values: [b1-wsl-zt]}
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchLabels: {app.kubernetes.io/name: vmagent}
          topologyKey: kubernetes.io/hostname
