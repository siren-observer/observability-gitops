---
apiVersion: batch/v1
kind: Job
metadata:
  annotations:
    governance.re8ch.com/change: retire-qianwen-grafana-publication
  name: retire-legacy-qianwen-grafana-v2
  namespace: flux-system
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: retire-legacy-qianwen-grafana
    spec:
      containers:
      - args:
        - --namespace
        - qianwen-ops
        - delete
        - configmap
        - panel-grafana-dashboard-providers
        - panel-grafana-datasources
        - re8ch-observability-grafana-alerts
        - --ignore-not-found=true
        - --wait=false
        command:
        - kubectl
        image: registry.k8s.io/kubectl:v1.34.1@sha256:59bafa07ff3a6d4b417e7633ddb9d79a9606ca98bf64bac080b3e65748669250
        name: delete-legacy-provisioning
        resources:
          limits:
            cpu: 100m
            memory: 64Mi
          requests:
            cpu: 10m
            memory: 32Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsGroup: 65532
          runAsNonRoot: true
          runAsUser: 65532
          seccompProfile:
            type: RuntimeDefault
      initContainers:
      - args:
        - --namespace
        - qianwen-ops
        - delete
        - ingress
        - grafana-dns-authority
        - panel-grafana
        - --ignore-not-found=true
        - --wait=true
        command:
        - kubectl
        image: registry.k8s.io/kubectl:v1.34.1@sha256:59bafa07ff3a6d4b417e7633ddb9d79a9606ca98bf64bac080b3e65748669250
        name: delete-public-ingresses
        resources:
          limits:
            cpu: 100m
            memory: 64Mi
          requests:
            cpu: 10m
            memory: 32Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsGroup: 65532
          runAsNonRoot: true
          runAsUser: 65532
          seccompProfile:
            type: RuntimeDefault
      - args:
        - --namespace
        - qianwen-ops
        - delete
        - httproute
        - grafana-edge-origin
        - grafana-http-redirect
        - grafana-public
        - panel-grafana-advfab
        - --ignore-not-found=true
        - --wait=true
        command:
        - kubectl
        image: registry.k8s.io/kubectl:v1.34.1@sha256:59bafa07ff3a6d4b417e7633ddb9d79a9606ca98bf64bac080b3e65748669250
        name: delete-public-routes
        resources:
          limits:
            cpu: 100m
            memory: 64Mi
          requests:
            cpu: 10m
            memory: 32Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsGroup: 65532
          runAsNonRoot: true
          runAsUser: 65532
          seccompProfile:
            type: RuntimeDefault
      - args:
        - --namespace
        - qianwen-ops
        - delete
        - deployment
        - panel-grafana
        - panel-grafana-renderer
        - --ignore-not-found=true
        - --wait=false
        command:
        - kubectl
        image: registry.k8s.io/kubectl:v1.34.1@sha256:59bafa07ff3a6d4b417e7633ddb9d79a9606ca98bf64bac080b3e65748669250
        name: delete-legacy-deployments
        resources:
          limits:
            cpu: 100m
            memory: 64Mi
          requests:
            cpu: 10m
            memory: 32Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsGroup: 65532
          runAsNonRoot: true
          runAsUser: 65532
          seccompProfile:
            type: RuntimeDefault
      - args:
        - --namespace
        - qianwen-ops
        - delete
        - service
        - panel-grafana
        - panel-grafana-renderer
        - panel-grafana-gateway-origin
        - panel-grafana-vip-origin
        - --ignore-not-found=true
        - --wait=false
        command:
        - kubectl
        image: registry.k8s.io/kubectl:v1.34.1@sha256:59bafa07ff3a6d4b417e7633ddb9d79a9606ca98bf64bac080b3e65748669250
        name: delete-legacy-services
        resources:
          limits:
            cpu: 100m
            memory: 64Mi
          requests:
            cpu: 10m
            memory: 32Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsGroup: 65532
          runAsNonRoot: true
          runAsUser: 65532
          seccompProfile:
            type: RuntimeDefault
      nodeSelector:
        kubernetes.io/hostname: b1-wsl-zt
      restartPolicy: OnFailure
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: retire-legacy-qianwen-grafana
  ttlSecondsAfterFinished: 604800
---
apiVersion: v1
automountServiceAccountToken: true
kind: ServiceAccount
metadata:
  name: retire-legacy-qianwen-grafana
  namespace: flux-system
