apiVersion: batch/v1
kind: CronJob
metadata:
  labels:
    app.kubernetes.io/part-of: re8ch-observability
  name: re8ch-grafana-org-sync
  namespace: observability-system
spec:
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 3
      template:
        metadata:
          labels:
            app.kubernetes.io/name: re8ch-grafana-org-sync
        spec:
          containers:
          - command:
            - python3
            - /contract/sync.py
            env:
            - name: GRAFANA_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  key: user
                  name: re8ch-grafana-admin
            - name: GRAFANA_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: password
                  name: re8ch-grafana-admin
            image: registry.re8ch.com/helm/connectool-ci-tools@sha256:b4769df9cbd6fc7c9e64b4a77a52752de8f5454a45fa0cd2ba2dded71d0c884d
            name: sync
            resources:
              limits:
                cpu: 100m
                memory: 128Mi
              requests:
                cpu: 10m
                memory: 32Mi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                - ALL
              readOnlyRootFilesystem: true
            volumeMounts:
            - mountPath: /contract
              name: contract
              readOnly: true
          restartPolicy: OnFailure
          serviceAccountName: re8ch-grafana
          volumes:
          - configMap:
              defaultMode: 292
              name: re8ch-grafana-org-contract
            name: contract
  schedule: 17 * * * *
