apiVersion: v1
data:
  fair-value-controller.py: "#!/usr/bin/env python3\n\"\"\"Continuously reconcile\
    \ book cost with independent public market prices.\"\"\"\n\nimport argparse\n\
    import datetime as dt\nimport http.server\nimport json\nimport math\nimport os\n\
    import statistics\nimport threading\nimport time\nimport urllib.parse\nimport\
    \ urllib.request\nimport xml.etree.ElementTree as ET\n\n\nHOURS_PER_MONTH = 730.0\n\
    \n\ndef fetch_json(url, timeout=30):\n    request = urllib.request.Request(url,\
    \ headers={\"User-Agent\": \"re8ch-fair-value/1.0\"})\n    with urllib.request.urlopen(request,\
    \ timeout=timeout) as response:\n        return json.load(response)\n\n\ndef fetch_ecb_usd_cny(url):\n\
    \    request = urllib.request.Request(url, headers={\"User-Agent\": \"re8ch-fair-value/1.0\"\
    })\n    with urllib.request.urlopen(request, timeout=30) as response:\n      \
    \  root = ET.fromstring(response.read())\n    rates = {element.attrib[\"currency\"\
    ]: float(element.attrib[\"rate\"])\n             for element in root.iter() if\
    \ \"currency\" in element.attrib}\n    return rates[\"CNY\"] / rates[\"USD\"]\n\
    \n\ndef quantity_for(target, offer):\n    ratios = []\n    for field in (\"cpuCores\"\
    , \"memoryGiB\", \"storageGiB\"):\n        requested = target.get(field)\n   \
    \     if requested is None:\n            continue\n        supplied = offer.get(field)\n\
    \        if supplied in (None, 0):\n            return None\n        ratios.append(float(requested)\
    \ / float(supplied))\n    return max(1, math.ceil(max(ratios))) if ratios else\
    \ None\n\n\ndef cheapest_equivalent(target, offers):\n    candidates = []\n  \
    \  for offer in offers:\n        quantity = quantity_for(target, offer)\n    \
    \    if quantity is None or offer.get(\"monthlyCNY\") is None:\n            continue\n\
    \        candidates.append((float(offer[\"monthlyCNY\"]) * quantity, quantity,\
    \ offer))\n    return min(candidates, key=lambda item: item[0]) if candidates\
    \ else None\n\n\ndef linode_offers(payload, usd_cny, region):\n    offers = []\n\
    \    for item in payload.get(\"data\", []):\n        monthly = item.get(\"price\"\
    , {}).get(\"monthly\")\n        for regional in item.get(\"region_prices\", []):\n\
    \            if regional.get(\"id\") == region:\n                monthly = regional.get(\"\
    monthly\", monthly)\n        if monthly is None:\n            continue\n     \
    \   offers.append({\n            \"sku\": item.get(\"id\"), \"region\": region,\n\
    \            \"cpuCores\": item.get(\"vcpus\"),\n            \"memoryGiB\": float(item.get(\"\
    memory\", 0)) / 1024,\n            \"storageGiB\": item.get(\"disk\"),\n     \
    \       \"monthlyCNY\": float(monthly) * usd_cny,\n        })\n    return offers\n\
    \n\ndef vultr_offers(payload, usd_cny, region):\n    offers = []\n    for item\
    \ in payload.get(\"plans\", []):\n        if region not in item.get(\"locations\"\
    , []):\n            continue\n        monthly = item.get(\"monthly_cost\")\n \
    \       if monthly is None or float(monthly) <= 0:\n            continue\n   \
    \     offers.append({\n            \"sku\": item.get(\"id\"), \"region\": region,\n\
    \            \"cpuCores\": item.get(\"vcpu_count\"),\n            \"memoryGiB\"\
    : float(item.get(\"ram\", 0)) / 1024,\n            \"storageGiB\": item.get(\"\
    disk\"),\n            \"monthlyCNY\": float(monthly) * usd_cny,\n        })\n\
    \    return offers\n\n\ndef azure_offers(payload, sku_specs):\n    offers = []\n\
    \    for item in payload.get(\"Items\", []):\n        sku = item.get(\"armSkuName\"\
    )\n        spec = sku_specs.get(sku)\n        if not spec or item.get(\"type\"\
    ) != \"Consumption\":\n            continue\n        meter = str(item.get(\"meterName\"\
    , \"\"))\n        product = str(item.get(\"productName\", \"\"))\n        if \"\
    Spot\" in meter or \"Windows\" in product or item.get(\"unitOfMeasure\") != \"\
    1 Hour\":\n            continue\n        offers.append({\n            \"sku\"\
    : sku, \"region\": item.get(\"armRegionName\"),\n            \"cpuCores\": spec[\"\
    cpuCores\"], \"memoryGiB\": spec[\"memoryGiB\"],\n            # Managed OS disk\
    \ is deliberately normalized as a separate 40 GiB\n            # equivalent so\
    \ Azure compute is not mistaken for storage-inclusive.\n            \"storageGiB\"\
    : spec.get(\"storageGiB\", 40),\n            \"monthlyCNY\": float(item[\"retailPrice\"\
    ]) * HOURS_PER_MONTH,\n        })\n    return offers\n\n\ndef aggregate(target,\
    \ observations, minimum_sources, now, max_age_hours):\n    fresh = [item for item\
    \ in observations\n             if (now - dt.datetime.fromisoformat(item[\"observedAt\"\
    ]).timestamp()) <= max_age_hours * 3600]\n    groups = {item[\"independenceGroup\"\
    ] for item in fresh}\n    result = {\n        \"node\": target[\"name\"], \"bookMonthlyCNY\"\
    : target.get(\"bookMonthlyCNY\"),\n        \"status\": \"unknown\", \"reason\"\
    : None, \"observations\": fresh,\n        \"fairMonthlyCNY\": None, \"varianceCNY\"\
    : None, \"varianceRatio\": None,\n        \"sourceCount\": len(groups), \"effectiveAt\"\
    : dt.datetime.fromtimestamp(now, dt.timezone.utc).isoformat(),\n    }\n    if\
    \ not all(target.get(field) is not None for field in (\"cpuCores\", \"memoryGiB\"\
    , \"storageGiB\")):\n        result[\"reason\"] = \"resource-quantity-incomplete\"\
    \n        return result\n    if len(groups) < minimum_sources:\n        result[\"\
    reason\"] = \"insufficient-independent-sources\"\n        return result\n    value\
    \ = statistics.median(item[\"monthlyCNY\"] for item in fresh)\n    if value <=\
    \ 0:\n        result[\"reason\"] = \"non-positive-market-value\"\n        return\
    \ result\n    result.update(status=\"usable\", fairMonthlyCNY=value)\n    book\
    \ = target.get(\"bookMonthlyCNY\")\n    if book is not None:\n        result[\"\
    varianceCNY\"] = value - float(book)\n        result[\"varianceRatio\"] = None\
    \ if float(book) == 0 else value / float(book) - 1\n    return result\n\n\ndef\
    \ esc(value):\n    return str(value).replace(\"\\\\\", \"\\\\\\\\\").replace('\"\
    ', '\\\\\"').replace(\"\\n\", \"\\\\n\")\n\n\ndef prom(name, value, labels):\n\
    \    suffix = \"{\" + \",\".join(f'{key}=\"{esc(val)}\"' for key, val in sorted(labels.items()))\
    \ + \"}\"\n    return f\"{name}{suffix} {value}\"\n\n\nclass Controller:\n   \
    \ def __init__(self, config, history_path, fetcher=fetch_json, clock=time.time):\n\
    \        self.config = config\n        self.history_path = history_path\n    \
    \    self.fetcher = fetcher\n        self.clock = clock\n        self.lock = threading.Lock()\n\
    \        self.snapshot = {\"status\": \"starting\", \"items\": []}\n        self.metrics\
    \ = \"\"\n\n    def refresh(self):\n        now = self.clock()\n        sources\
    \ = self.config[\"sources\"]\n        usd_cny = fetch_ecb_usd_cny(sources[\"ecb\"\
    ][\"url\"])\n        linode = self.fetcher(sources[\"linode\"][\"url\"])\n   \
    \     vultr = self.fetcher(sources[\"vultr\"][\"url\"])\n        azure_payloads\
    \ = {}\n        for region in sorted(set(item[\"azure\"] for item in self.config[\"\
    regionMappings\"].values())):\n            query = \"serviceName eq 'Virtual Machines'\
    \ and armRegionName eq '%s' and priceType eq 'Consumption'\" % region\n      \
    \      url = sources[\"azure\"][\"url\"] + \"?\" + urllib.parse.urlencode({\"\
    currencyCode\": \"CNY\", \"$filter\": query})\n            azure_payloads[region]\
    \ = self.fetcher(url)\n        observed_at = dt.datetime.fromtimestamp(now, dt.timezone.utc).isoformat()\n\
    \        items = []\n        for target in self.config[\"targets\"]:\n       \
    \     mapping = self.config[\"regionMappings\"].get(target[\"regionGroup\"])\n\
    \            if mapping is None:\n                item = aggregate(target, [],\
    \ self.config[\"minimumIndependentSources\"], now,\n                         \
    \        self.config[\"maximumObservationAgeHours\"])\n                item[\"\
    reason\"] = \"region-mapping-missing\"\n                items.append(item)\n \
    \               continue\n            inventory_complete = all(target.get(field)\
    \ is not None for field in (\"cpuCores\", \"memoryGiB\", \"storageGiB\"))\n  \
    \          source_offers = {\n                \"linode\": linode_offers(linode,\
    \ usd_cny, mapping[\"linode\"]),\n                \"vultr\": vultr_offers(vultr,\
    \ usd_cny, mapping[\"vultr\"]),\n                \"azure\": azure_offers(azure_payloads[mapping[\"\
    azure\"]], self.config[\"azureSkuSpecs\"]),\n            }\n            observations\
    \ = []\n            for source_id, offers in source_offers.items() if inventory_complete\
    \ else ():\n                selected = cheapest_equivalent(target, offers)\n \
    \               if not selected:\n                    continue\n             \
    \   amount, quantity, offer = selected\n                observations.append({\n\
    \                    \"source\": source_id, \"independenceGroup\": source_id,\n\
    \                    \"region\": offer[\"region\"], \"sku\": offer[\"sku\"], \"\
    quantity\": quantity,\n                    \"monthlyCNY\": round(amount, 6), \"\
    observedAt\": observed_at,\n                    \"resourceClass\": target[\"resourceClass\"\
    ],\n                    \"resourceQuantity\": {key: target[key] for key in (\"\
    cpuCores\", \"memoryGiB\", \"storageGiB\")},\n                })\n           \
    \ items.append(aggregate(target, observations, self.config[\"minimumIndependentSources\"\
    ], now,\n                                   self.config[\"maximumObservationAgeHours\"\
    ]))\n        snapshot = {\"status\": \"ready\", \"generatedAt\": observed_at,\
    \ \"currency\": \"CNY\", \"items\": items}\n        lines = [prom(\"re8ch_fair_value_refresh_success\"\
    , 1, {})]\n        for item in items:\n            labels = {\"node\": item[\"\
    node\"], \"status\": item[\"status\"], \"reason\": item[\"reason\"] or \"none\"\
    }\n            lines.append(prom(\"re8ch_fair_value_source_count\", item[\"sourceCount\"\
    ], labels))\n            lines.append(prom(\"re8ch_fair_value_usable\", 1 if item[\"\
    status\"] == \"usable\" else 0, labels))\n            if item[\"bookMonthlyCNY\"\
    ] is not None:\n                lines.append(prom(\"re8ch_book_value_monthly_cny\"\
    , item[\"bookMonthlyCNY\"], labels))\n            if item[\"fairMonthlyCNY\"]\
    \ is not None:\n                lines.append(prom(\"re8ch_fair_value_monthly_cny\"\
    , item[\"fairMonthlyCNY\"], labels))\n                if item[\"varianceCNY\"\
    ] is not None:\n                    lines.append(prom(\"re8ch_fair_value_variance_cny\"\
    , item[\"varianceCNY\"], labels))\n                if item[\"varianceRatio\"]\
    \ is not None:\n                    lines.append(prom(\"re8ch_fair_value_variance_ratio\"\
    , item[\"varianceRatio\"], labels))\n        os.makedirs(os.path.dirname(self.history_path),\
    \ exist_ok=True)\n        with open(self.history_path, \"a\", encoding=\"utf-8\"\
    ) as handle:\n            handle.write(json.dumps(snapshot, ensure_ascii=False,\
    \ sort_keys=True) + \"\\n\")\n        with self.lock:\n            self.snapshot\
    \ = snapshot\n            self.metrics = \"\\n\".join(lines) + \"\\n\"\n\n   \
    \ def loop(self):\n        while True:\n            try:\n                self.refresh()\n\
    \            except Exception as exc:\n                with self.lock:\n     \
    \               self.snapshot = {\"status\": \"degraded\", \"error\": str(exc),\
    \ \"items\": self.snapshot.get(\"items\", [])}\n                    self.metrics\
    \ = prom(\"re8ch_fair_value_refresh_success\", 0, {}) + \"\\n\"\n            time.sleep(self.config[\"\
    refreshIntervalSeconds\"])\n\n\ndef main():\n    parser = argparse.ArgumentParser()\n\
    \    parser.add_argument(\"--config\", required=True)\n    parser.add_argument(\"\
    --history\", required=True)\n    parser.add_argument(\"--listen\", default=\"\
    0.0.0.0:9789\")\n    args = parser.parse_args()\n    with open(args.config, encoding=\"\
    utf-8\") as handle:\n        controller = Controller(json.load(handle), args.history)\n\
    \    threading.Thread(target=controller.loop, daemon=True).start()\n    host,\
    \ port = args.listen.rsplit(\":\", 1)\n\n    class Handler(http.server.BaseHTTPRequestHandler):\n\
    \        def do_GET(self):\n            with controller.lock:\n              \
    \  if self.path == \"/metrics\":\n                    body, content_type = controller.metrics.encode(),\
    \ \"text/plain; version=0.0.4\"\n                elif self.path == \"/api/v1/valuations\"\
    :\n                    body, content_type = json.dumps(controller.snapshot, ensure_ascii=False).encode(),\
    \ \"application/json\"\n                elif self.path == \"/healthz\":\n    \
    \                body, content_type = json.dumps({\"status\": controller.snapshot[\"\
    status\"]}).encode(), \"application/json\"\n                else:\n          \
    \          self.send_error(404)\n                    return\n            self.send_response(200\
    \ if self.path != \"/healthz\" or controller.snapshot[\"status\"] == \"ready\"\
    \ else 503)\n            self.send_header(\"Content-Type\", content_type)\n  \
    \          self.send_header(\"Cache-Control\", \"no-store\")\n            self.send_header(\"\
    Content-Length\", str(len(body)))\n            self.end_headers()\n          \
    \  self.wfile.write(body)\n\n        def log_message(self, *_args):\n        \
    \    return\n\n    http.server.ThreadingHTTPServer((host, int(port)), Handler).serve_forever()\n\
    \n\nif __name__ == \"__main__\":\n    main()\n"
