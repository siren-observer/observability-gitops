---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: re8ch-fair-value-controller
    app.kubernetes.io/part-of: re8ch-observability
  name: re8ch-fair-value-controller
  namespace: observability-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: re8ch-fair-value-controller
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        observability.re8ch.com/fair-value-revision: region-isolation-v1
      labels:
        app.kubernetes.io/name: re8ch-fair-value-controller
        app.kubernetes.io/part-of: re8ch-observability
    spec:
      containers:
      - args:
        - --config=/config/fair-value-config.json
        - --history=/history/valuations.jsonl
        command:
        - python3
        - /app/fair-value-controller.py
        image: python:3.13-alpine@sha256:9ba6d8cbebf0fb6546ae71f2a1c14f6ffd2fdab83af7fa5669734ef30ad48844
        livenessProbe:
          initialDelaySeconds: 30
          periodSeconds: 30
          tcpSocket:
            port: metrics
        name: controller
        ports:
        - containerPort: 9789
          name: metrics
        readinessProbe:
          httpGet:
            path: /healthz
            port: metrics
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          limits:
            cpu: 250m
            memory: 192Mi
          requests:
            cpu: 25m
            memory: 48Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 65532
        volumeMounts:
        - mountPath: /app
          name: code
          readOnly: true
        - mountPath: /config
          name: config
          readOnly: true
        - mountPath: /history
          name: history
        - mountPath: /tmp
          name: tmp
      nodeSelector:
        kubernetes.io/hostname: r640
      serviceAccountName: re8ch-fair-value-controller
      volumes:
      - configMap:
          defaultMode: 365
          name: re8ch-fair-value-controller-code
        name: code
      - configMap:
          name: re8ch-fair-value-controller-config
        name: config
      - name: history
        persistentVolumeClaim:
          claimName: re8ch-fair-value-history
      - emptyDir: {}
        name: tmp
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: re8ch-grafana
    app.kubernetes.io/part-of: re8ch-observability
  name: re8ch-grafana
  namespace: observability-system
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: re8ch-grafana
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        re8ch.com/recovery-revision: 2026-09-21-database-ready-v1
      labels:
        app.kubernetes.io/name: re8ch-grafana
        app.kubernetes.io/part-of: re8ch-observability
    spec:
      containers:
      - env:
        - name: GF_SERVER_DOMAIN
          value: grafana.re8ch.com
        - name: GF_SERVER_ROOT_URL
          value: https://grafana.service.re8ch.com/grafana/
        - name: GF_SERVER_SERVE_FROM_SUB_PATH
          value: 'true'
        - name: GF_SECURITY_COOKIE_SECURE
          value: 'true'
        - name: GF_USERS_ALLOW_SIGN_UP
          value: 'false'
        - name: GF_AUTH_ANONYMOUS_ENABLED
          value: 'false'
        - name: GF_SECURITY_ADMIN_USER
          valueFrom:
            secretKeyRef:
              key: user
              name: re8ch-grafana-admin
        - name: GF_SECURITY_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              key: password
              name: re8ch-grafana-admin
        - name: GF_ANALYTICS_REPORTING_ENABLED
          value: 'false'
        - name: GF_ANALYTICS_CHECK_FOR_UPDATES
          value: 'false'
        - name: GF_DATABASE_TYPE
          value: postgres
        - name: GF_DATABASE_SSL_MODE
          value: disable
        - name: GF_DATABASE_HOST
          valueFrom:
            secretKeyRef:
              key: host
              name: re8ch-grafana-database
        - name: GF_DATABASE_NAME
          valueFrom:
            secretKeyRef:
              key: name
              name: re8ch-grafana-database
        - name: GF_DATABASE_USER
          valueFrom:
            secretKeyRef:
              key: user
              name: re8ch-grafana-database
        - name: GF_DATABASE_PASSWORD
          valueFrom:
            secretKeyRef:
              key: password
              name: re8ch-grafana-database
        - name: GF_AUTH_GENERIC_OAUTH_ENABLED
          value: 'true'
        - name: GF_AUTH_GENERIC_OAUTH_NAME
          value: RE8CH Dex
        - name: GF_AUTH_GENERIC_OAUTH_CLIENT_ID
          value: re8ch-grafana
        - name: GF_AUTH_GENERIC_OAUTH_USE_PKCE
          value: 'true'
        - name: GF_AUTH_GENERIC_OAUTH_SCOPES
          value: openid profile email groups
        - name: GF_AUTH_GENERIC_OAUTH_AUTH_URL
          value: https://dex.service.re8ch.com/auth
        - name: GF_AUTH_GENERIC_OAUTH_TOKEN_URL
          value: https://dex.service.re8ch.com/token
        - name: GF_AUTH_GENERIC_OAUTH_API_URL
          value: https://dex.service.re8ch.com/userinfo
        - name: GF_AUTH_GENERIC_OAUTH_ALLOW_SIGN_UP
          value: 'true'
        - name: GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH
          value: contains(groups[*], 're8ch:k8s-admins') && 'Admin' || 'Viewer'
        - name: GF_AUTH_GENERIC_OAUTH_ORG_ATTRIBUTE_PATH
          value: contains(groups[*], 're8ch:k8s-admins') && 'RE8CH Platform' || contains(groups[*],
            're8ch:qwen-operators') && 'Qianwen' || contains(groups[*], 're8ch:ledger-operators')
            && 'Ledger' || contains(groups[*], 're8ch:anycam-operators') && 'Anycam'
            || contains(groups[*], 're8ch:bench-operators') && 'Bench' || contains(groups[*],
            're8ch:cardcat-operators') && 'Cardcat' || 'NoAccess'
        - name: GF_AUTH_GENERIC_OAUTH_ORG_MAPPING
          value: RE8CH Platform:1:Admin,Qianwen:Qianwen:Viewer,Ledger:Ledger:Viewer,Anycam:Anycam:Viewer,Bench:Bench:Viewer,Cardcat:Cardcat:Viewer
        - name: GF_RENDERING_SERVER_URL
          value: http://re8ch-grafana-renderer.observability-system.svc.cluster.local:8081/render
        - name: GF_RENDERING_CALLBACK_URL
          value: http://re8ch-grafana.observability-system.svc.cluster.local:3000/grafana/
        - name: GF_RENDERING_RENDERER_TOKEN
          valueFrom:
            secretKeyRef:
              key: token
              name: re8ch-grafana-renderer-auth
        - name: GF_PLUGINS_PREINSTALL
          value: victoriametrics-metrics-datasource@0.18.0,victoriametrics-logs-datasource@0.17.0,yesoreyeram-infinity-datasource@3.8.0,marcusolsson-static-datasource@1.6.0
        - name: GF_PLUGINS_PREINSTALL_AUTO_UPDATE
          value: 'false'
        image: docker.io/grafana/grafana@sha256:0f86bada30d65ef9d0183b90c1e2682ac92d53d95da8bed322b984ea78a4a73a
        imagePullPolicy: IfNotPresent
        livenessProbe:
          httpGet:
            path: /api/health
            port: http
          initialDelaySeconds: 60
          periodSeconds: 30
        name: grafana
        ports:
        - containerPort: 3000
          name: http
        readinessProbe:
          httpGet:
            path: /api/health
            port: http
          initialDelaySeconds: 10
          periodSeconds: 10
        resources:
          limits:
            cpu: 500m
            memory: 768Mi
          requests:
            cpu: 50m
            memory: 192Mi
        volumeMounts:
        - mountPath: /var/lib/grafana
          name: data
        - mountPath: /etc/grafana/provisioning/datasources
          name: datasources
          readOnly: true
        - mountPath: /etc/grafana/provisioning/dashboards
          name: dashboards
          readOnly: true
        - mountPath: /var/lib/grafana/dashboards
          name: dashboard-files
          readOnly: true
        - mountPath: /etc/grafana/provisioning/alerting/re8ch-composite-alerts.yaml
          name: alerts
          readOnly: true
          subPath: composite-alerts.yaml
      nodeSelector:
        kubernetes.io/hostname: r640
      securityContext:
        fsGroup: 472
      serviceAccountName: re8ch-grafana
      volumes:
      - emptyDir:
          sizeLimit: 1Gi
        name: data
      - configMap:
          name: re8ch-observability-datasources
        name: datasources
      - configMap:
          name: re8ch-grafana-dashboard-providers
        name: dashboards
      - configMap:
          name: re8ch-observability-dashboards
        name: dashboard-files
      - configMap:
          name: re8ch-observability-grafana-alerts
        name: alerts
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: re8ch-grafana-postgresql
    app.kubernetes.io/part-of: re8ch-observability
  name: re8ch-grafana-postgresql
  namespace: observability-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: re8ch-grafana-postgresql
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: re8ch-grafana-postgresql
        app.kubernetes.io/part-of: re8ch-observability
    spec:
      containers:
      - env:
        - name: POSTGRES_DB
          valueFrom:
            secretKeyRef:
              key: name
              name: re8ch-grafana-database
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              key: user
              name: re8ch-grafana-database
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              key: password
              name: re8ch-grafana-database
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        image: docker.io/library/postgres@sha256:7c688148e5e156d0e86df7ba8ae5a05a2386aaec1e2ad8e6d11bdf10504b1fb7
        imagePullPolicy: IfNotPresent
        livenessProbe:
          exec:
            command:
            - sh
            - -ec
            - pg_isready -U $POSTGRES_USER -d $POSTGRES_DB
          initialDelaySeconds: 30
          periodSeconds: 15
        name: postgresql
        ports:
        - containerPort: 5432
          name: postgresql
        readinessProbe:
          exec:
            command:
            - sh
            - -ec
            - pg_isready -U $POSTGRES_USER -d $POSTGRES_DB
          periodSeconds: 5
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 50m
            memory: 128Mi
        volumeMounts:
        - mountPath: /var/lib/postgresql/data
          name: data
      nodeSelector:
        kubernetes.io/hostname: r640
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: re8ch-grafana-postgresql-data-v2
---
