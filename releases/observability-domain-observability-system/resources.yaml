apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: re8ch-gateway
  namespace: observability-system
spec:
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
        - matchExpressions:
          - key: kubernetes.io/hostname
            operator: In
            values:
            - b1-wsl-zt
            - r640
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
      - labelSelector:
          matchLabels:
            app.kubernetes.io/name: re8ch-gateway-collector
        topologyKey: kubernetes.io/hostname
  config:
    connectors:
      servicegraph:
        dimensions:
        - service.namespace
        - k8s.namespace.name
      spanmetrics:
        dimensions:
        - name: service.namespace
        - name: k8s.node.name
        histogram:
          explicit:
            buckets:
            - 5ms
            - 10ms
            - 25ms
            - 50ms
            - 100ms
            - 250ms
            - 500ms
            - 1s
            - 2.5s
            - 5s
            - 10s
    exporters:
      otlphttp/logs:
        endpoint: http://vlsingle-re8ch-logs.observability-system.svc.cluster.local:9428/insert/opentelemetry
      otlphttp/traces:
        endpoint: http://vtinsert-re8ch-traces.observability-system.svc:10481/insert/opentelemetry
      prometheusremotewrite:
        endpoint: http://vminsert-re8ch-metrics.observability-system.svc:8480/insert/0/prometheus/api/v1/write
        resource_to_telemetry_conversion:
          enabled: true
    processors:
      batch:
        send_batch_size: 4096
        timeout: 5s
      k8sattributes:
        auth_type: serviceAccount
        extract:
          metadata:
          - k8s.namespace.name
          - k8s.deployment.name
          - k8s.statefulset.name
          - k8s.daemonset.name
          - k8s.pod.name
          - k8s.node.name
      memory_limiter:
        check_interval: 1s
        limit_mib: 1536
        spike_limit_mib: 384
      tail_sampling:
        decision_wait: 10s
        num_traces: 100000
        policies:
        - name: errors
          status_code:
            status_codes:
            - ERROR
          type: status_code
        - latency:
            threshold_ms: 1000
          name: slow
          type: latency
        - name: baseline
          probabilistic:
            sampling_percentage: 10
          type: probabilistic
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
    service:
      pipelines:
        logs:
          exporters:
          - otlphttp/logs
          processors:
          - memory_limiter
          - k8sattributes
          - batch
          receivers:
          - otlp
        metrics:
          exporters:
          - prometheusremotewrite
          processors:
          - memory_limiter
          - k8sattributes
          - batch
          receivers:
          - otlp
          - spanmetrics
          - servicegraph
        traces:
          exporters:
          - spanmetrics
          - servicegraph
          - otlphttp/traces
          processors:
          - memory_limiter
          - k8sattributes
          - tail_sampling
          - batch
          receivers:
          - otlp
      telemetry:
        metrics:
          readers:
          - pull:
              exporter:
                prometheus:
                  host: 0.0.0.0
                  port: 8888
  deploymentUpdateStrategy:
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
    type: RollingUpdate
  image: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-contrib:0.153.0@sha256:93aad750175cbf1a973ae1c5886c3371f4d800f61be25cdd26870b8441ffe9fa
  mode: deployment
  replicas: 2
  resources:
    limits:
      cpu: '2'
      memory: 2Gi
    requests:
      cpu: 250m
      memory: 512Mi
  tolerations:
  - effect: NoSchedule
    key: storage.re8ch.com/coordinator
    operator: Equal
    value: 'true'
---
apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: re8ch-node-agent
  namespace: observability-system
spec:
  config:
    exporters:
      otlp:
        endpoint: re8ch-gateway-collector.observability-system.svc:4317
        tls:
          insecure: true
    processors:
      batch:
        timeout: 5s
      memory_limiter:
        check_interval: 1s
        limit_mib: 384
      resource:
        attributes:
        - action: upsert
          key: k8s.node.name
          value: ${env:K8S_NODE_NAME}
        - action: upsert
          key: cluster
          value: re8ch
    receivers:
      hostmetrics:
        collection_interval: 30s
        scrapers:
          cpu: {}
          disk: {}
          filesystem:
            exclude_mount_points:
              match_type: regexp
              mount_points:
              - /dev/*
              - /proc/*
              - /sys/*
              - /var/lib/kubelet/pods/*/volumes/kubernetes.io~secret/*
          load: {}
          memory: {}
          network: {}
          paging: {}
          processes: {}
      kubeletstats:
        auth_type: serviceAccount
        collection_interval: 30s
        endpoint: https://${env:K8S_NODE_NAME}:10250
        insecure_skip_verify: true
        metric_groups:
        - node
        - pod
        - container
        - volume
    service:
      pipelines:
        metrics:
          exporters:
          - otlp
          processors:
          - memory_limiter
          - resource
          - batch
          receivers:
          - hostmetrics
          - kubeletstats
  env:
  - name: K8S_NODE_NAME
    valueFrom:
      fieldRef:
        fieldPath: spec.nodeName
  mode: daemonset
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 50m
      memory: 128Mi
