    \nauth = base64.b64encode((os.environ[\"GRAFANA_ADMIN_USER\"] + \":\" + os.environ[\"\
    GRAFANA_ADMIN_PASSWORD\"]).encode()).decode()\nheaders = {\"Authorization\": \"\
    Basic \" + auth, \"Content-Type\": \"application/json\"}\ndef request(path, method=\"\
    GET\", body=None):\n    data = json.dumps(body).encode() if body else None\n \
    \   return urllib.request.urlopen(urllib.request.Request(endpoint + path, data=data,\
    \ headers=headers, method=method), timeout=15)\nexisting = {item[\"name\"] for\
    \ item in json.load(request(\"/orgs\"))}\nfor org in json.load(open(\"/contract/orgs.json\"\
    ))[\"orgs\"]:\n    if org[\"name\"] not in existing:\n        request(\"/orgs\"\
