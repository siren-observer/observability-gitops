kind: ConfigMap
metadata:
  labels:
    app.kubernetes.io/part-of: re8ch-observability
    grafana_dashboard: '1'
  name: re8ch-observability-dashboards
  namespace: observability-system
---
apiVersion: v1
data:
  datasources.yaml: "apiVersion: 1\ndatasources:\n  - name: RE8CH Raw Metrics\n  \
    \  uid: ds-prometheus\n    type: prometheus\n    access: proxy\n    url: http://vmselect-re8ch-metrics.observability-system.svc:8481/select/0/prometheus\n\
    \    isDefault: true\n    jsonData: {timeInterval: 15s, exemplarTraceIdDestinations:\
    \ [{name: trace_id, datasourceUid: re8ch-traces}]}\n  - name: RE8CH Analytics\n\
    \    uid: re8ch-analytics\n    type: prometheus\n    access: proxy\n    url: http://vmsingle-re8ch-analytics.observability-system.svc:8429\n\
    \    jsonData: {timeInterval: 30s}\n  - name: RE8CH Cost Metrics\n    uid: re8ch-costs\n\
    \    type: prometheus\n    access: proxy\n    url: http://vmsingle-opencost.observability-system.svc:8429\n\
    \    jsonData: {timeInterval: 30s}\n  - name: RE8CH Traces\n    uid: re8ch-traces\n\
    \    type: jaeger\n    access: proxy\n    url: http://vtselect-re8ch-traces.observability-system.svc:10471/select/jaeger\n\
    \    jsonData:\n      tracesToLogsV2: {datasourceUid: re8ch-vlogs, spanStartTimeShift:\
    \ -5m, spanEndTimeShift: 5m, tags: [service.name, k8s.namespace.name, k8s.pod.name]}\n\
    \      tracesToMetrics: {datasourceUid: ds-prometheus, spanStartTimeShift: -5m,\
    \ spanEndTimeShift: 5m, tags: [{key: service.name, value: service_name}]}\n  -\
    \ name: RE8CH Events and Logs\n    uid: re8ch-vlogs\n    type: victoriametrics-logs-datasource\n\
    \    access: proxy\n    url: http://vlsingle-re8ch-logs.observability-system.svc.cluster.local:9428\n"
kind: ConfigMap
metadata:
  labels:
    app.kubernetes.io/part-of: re8ch-observability
    grafana_datasource: '1'
  name: re8ch-observability-datasources
  namespace: observability-system
---
apiVersion: v1
data:
  composite-alerts.yaml: "apiVersion: 1\ngroups:\n  - orgId: 1\n    name: RE8CH multi-signal\n\
    \    folder: RE8CH Composite Alerts\n    interval: 1m\n    rules:\n      - uid:\
    \ re8ch-service-multisignal\n        title: Service availability, errors and latency\
    \ degradation\n        condition: G\n        for: 10m\n        noDataState: OK\n\
    \        execErrState: Error\n        labels: {severity: critical, alert_layer:\
    \ grafana, owner: platform-observability}\n        notification_settings:\n  \
    \        receiver: RE8CH Alertmanager\n          group_by: [grafana_folder, alertname,\
    \ service]\n          group_wait: 30s\n          group_interval: 5m\n        \
    \  repeat_interval: 30m\n        annotations:\n          summary: A critical service\
    \ is degraded across multiple signals\n          runbook_url: https://github.com/re8ch/service-backend/blob/main/runbooks/observability/application-observability-contract.md\n\
    \        data:\n          - refId: A\n            relativeTimeRange: {from: 600,\
    \ to: 0}\n            datasourceUid: ds-prometheus\n            model: {expr:\
    \ 're8ch:service:target_up:ratio{tier=\"critical\"}', instant: true, refId: A}\n\
    \          - refId: B\n            relativeTimeRange: {from: 600, to: 0}\n   \
    \         datasourceUid: ds-prometheus\n            model: {expr: 're8ch:service:http_errors:ratio5m{tier=\"\
    critical\"}', instant: true, refId: B}\n          - refId: C\n            relativeTimeRange:\
    \ {from: 600, to: 0}\n            datasourceUid: ds-prometheus\n            model:\
    \ {expr: 're8ch:service:http_latency:p95_5m{tier=\"critical\"}', instant: true,\
    \ refId: C}\n          - refId: D\n            datasourceUid: __expr__\n     \
    \       model: {expression: A, reducer: last, refId: D, type: reduce}\n      \
    \    - refId: E\n            datasourceUid: __expr__\n            model: {expression:\
    \ B, reducer: last, refId: E, type: reduce}\n          - refId: F\n          \
    \  datasourceUid: __expr__\n            model: {expression: C, reducer: last,\
    \ refId: F, type: reduce}\n          - refId: G\n            datasourceUid: __expr__\n\
    \            model: {expression: '($D < 0.99) && (($E > 0.05) || ($F > 1))', refId:\
    \ G, type: math}\ncontactPoints:\n  - orgId: 1\n    name: RE8CH Alertmanager\n\
    \    receivers:\n      - uid: re8ch-alertmanager\n        type: prometheus-alertmanager\n\
    \        disableResolveMessage: false\n        settings:\n          url: http://vmalertmanager-re8ch-alertmanager.observability-system.svc.cluster.local:9093\n"
