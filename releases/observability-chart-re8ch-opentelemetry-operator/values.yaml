admissionWebhooks:
  failurePolicy: Ignore
  pods:
    failurePolicy: Ignore
fullnameOverride: otel-operator-opentelemetry-operator
manager:
  collectorImage:
    repository: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-k8s
    tag: 0.153.0
  leaderElection:
    enabled: true
  resources:
    limits:
      cpu: 150m
      memory: 192Mi
    requests:
      cpu: 25m
      memory: 96Mi
nodeSelector:
  kubernetes.io/hostname: r640
pdb:
  create: true
  minAvailable: 1
replicaCount: 1
