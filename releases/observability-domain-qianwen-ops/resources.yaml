---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: retire-legacy-qianwen-grafana
  namespace: qianwen-ops
rules:
- apiGroups:
  - networking.k8s.io
  resourceNames:
  - grafana-dns-authority
  - panel-grafana
  resources:
  - ingresses
  verbs:
  - get
  - delete
- apiGroups:
  - gateway.networking.k8s.io
  resourceNames:
  - grafana-edge-origin
  - grafana-http-redirect
  - grafana-public
  - panel-grafana-advfab
  resources:
  - httproutes
  verbs:
  - get
  - delete
- apiGroups:
  - apps
  resourceNames:
  - panel-grafana
  - panel-grafana-renderer
  resources:
  - deployments
  verbs:
  - get
  - delete
- apiGroups:
  - ''
  resourceNames:
  - panel-grafana
  - panel-grafana-renderer
  - panel-grafana-gateway-origin
  - panel-grafana-vip-origin
  resources:
  - services
  verbs:
  - get
  - delete
- apiGroups:
  - ''
  resourceNames:
  - panel-grafana-dashboard-providers
  - panel-grafana-datasources
  - re8ch-observability-grafana-alerts
  resources:
  - configmaps
  verbs:
  - get
  - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: retire-legacy-qianwen-grafana
  namespace: qianwen-ops
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: retire-legacy-qianwen-grafana
subjects:
- kind: ServiceAccount
  name: retire-legacy-qianwen-grafana
  namespace: flux-system
