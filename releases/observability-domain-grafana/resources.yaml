---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: re8ch-grafana
    app.kubernetes.io/part-of: re8ch-observability
  name: re8ch-grafana
  namespace: observability-system
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: re8ch-grafana
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        re8ch.com/recovery-revision: 2026-09-21-database-ready-v1
      labels:
        app.kubernetes.io/name: re8ch-grafana
        app.kubernetes.io/part-of: re8ch-observability
    spec:
      containers:
      - env:
        - name: GF_SERVER_DOMAIN
          value: grafana.re8ch.com
        - name: GF_SERVER_ROOT_URL
          value: https://grafana.service.re8ch.com/grafana/
        - name: GF_SERVER_SERVE_FROM_SUB_PATH
          value: 'true'
        - name: GF_SECURITY_COOKIE_SECURE
          value: 'true'
        - name: GF_USERS_ALLOW_SIGN_UP
          value: 'false'
        - name: GF_AUTH_ANONYMOUS_ENABLED
          value: 'false'
        - name: GF_SECURITY_ADMIN_USER
          valueFrom:
            secretKeyRef:
              key: user
              name: re8ch-grafana-admin
        - name: GF_SECURITY_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              key: password
              name: re8ch-grafana-admin
        - name: GF_ANALYTICS_REPORTING_ENABLED
          value: 'false'
        - name: GF_ANALYTICS_CHECK_FOR_UPDATES
          value: 'false'
        - name: GF_DATABASE_TYPE
          value: postgres
        - name: GF_DATABASE_SSL_MODE
          value: disable
        - name: GF_DATABASE_HOST
          valueFrom:
            secretKeyRef:
              key: host
              name: re8ch-grafana-database
        - name: GF_DATABASE_NAME
          valueFrom:
            secretKeyRef:
              key: name
              name: re8ch-grafana-database
        - name: GF_DATABASE_USER
          valueFrom:
            secretKeyRef:
              key: user
              name: re8ch-grafana-database
        - name: GF_DATABASE_PASSWORD
          valueFrom:
            secretKeyRef:
              key: password
              name: re8ch-grafana-database
        - name: GF_AUTH_GENERIC_OAUTH_ENABLED
          value: 'true'
        - name: GF_AUTH_GENERIC_OAUTH_NAME
          value: RE8CH UserHub
        - name: GF_AUTH_GENERIC_OAUTH_CLIENT_ID
          value: c3ce4282-3121-409d-b2dd-acbc3714d255
        - name: GF_AUTH_GENERIC_OAUTH_USE_PKCE
          value: 'true'
        - name: GF_AUTH_GENERIC_OAUTH_SCOPES
          value: openid profile email offline_access
        - name: GF_AUTH_GENERIC_OAUTH_AUTH_URL
          value: https://db-rw.re8ch.com/auth/v1/oauth/authorize
        - name: GF_AUTH_GENERIC_OAUTH_TOKEN_URL
          value: https://db-rw.re8ch.com/auth/v1/oauth/token
        - name: GF_AUTH_GENERIC_OAUTH_API_URL
          value: https://db-rw.re8ch.com/auth/v1/oauth/userinfo
        - name: GF_AUTH_GENERIC_OAUTH_ALLOW_SIGN_UP
          value: 'false'
        - name: GF_AUTH_GENERIC_OAUTH_LOGIN_ATTRIBUTE_PATH
          value: email
        - name: GF_AUTH_GENERIC_OAUTH_NAME_ATTRIBUTE_PATH
          value: name
        - name: GF_AUTH_GENERIC_OAUTH_USE_REFRESH_TOKEN
          value: 'true'
        - name: GF_AUTH_GENERIC_OAUTH_SKIP_ORG_ROLE_SYNC
          value: 'true'
        - name: GF_AUTH_GENERIC_OAUTH_VALIDATE_ID_TOKEN
          value: 'true'
        - name: GF_AUTH_GENERIC_OAUTH_JWK_SET_URL
          value: https://db-rw.re8ch.com/auth/v1/.well-known/jwks.json
        - name: GF_RENDERING_SERVER_URL
          value: http://re8ch-grafana-renderer.observability-system.svc.cluster.local:8081/render
        - name: GF_RENDERING_CALLBACK_URL
          value: http://re8ch-grafana.observability-system.svc.cluster.local:3000/grafana/
        - name: GF_RENDERING_RENDERER_TOKEN
          valueFrom:
            secretKeyRef:
              key: token
              name: re8ch-grafana-renderer-auth
        - name: GF_PLUGINS_PREINSTALL
          value: victoriametrics-metrics-datasource@0.18.0,victoriametrics-logs-datasource@0.17.0,yesoreyeram-infinity-datasource@3.8.0,marcusolsson-static-datasource@1.6.0
        - name: GF_PLUGINS_PREINSTALL_AUTO_UPDATE
          value: 'false'
        image: docker.io/grafana/grafana@sha256:0f86bada30d65ef9d0183b90c1e2682ac92d53d95da8bed322b984ea78a4a73a
        imagePullPolicy: IfNotPresent
        livenessProbe:
          httpGet:
            path: /api/health
            port: http
          initialDelaySeconds: 60
          periodSeconds: 30
        name: grafana
        ports:
        - containerPort: 3000
          name: http
        readinessProbe:
          httpGet:
            path: /api/health
            port: http
          initialDelaySeconds: 10
          periodSeconds: 10
        resources:
          limits:
            cpu: 500m
            memory: 768Mi
          requests:
            cpu: 50m
            memory: 192Mi
        volumeMounts:
        - mountPath: /var/lib/grafana
          name: data
        - mountPath: /etc/grafana/provisioning/datasources
          name: datasources
          readOnly: true
        - mountPath: /etc/grafana/provisioning/dashboards
          name: dashboards
          readOnly: true
        - mountPath: /var/lib/grafana/dashboards
          name: dashboard-files
          readOnly: true
        - mountPath: /etc/grafana/provisioning/alerting/re8ch-composite-alerts.yaml
          name: alerts
          readOnly: true
          subPath: composite-alerts.yaml
      nodeSelector:
        kubernetes.io/hostname: r640
      securityContext:
        fsGroup: 472
      serviceAccountName: re8ch-grafana
      volumes:
      - emptyDir:
          sizeLimit: 1Gi
        name: data
      - configMap:
          name: re8ch-observability-datasources
        name: datasources
      - configMap:
          name: re8ch-grafana-dashboard-providers
        name: dashboards
      - configMap:
          name: re8ch-observability-dashboards
        name: dashboard-files
      - configMap:
          name: re8ch-observability-grafana-alerts
        name: alerts
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: re8ch-grafana-postgresql
    app.kubernetes.io/part-of: re8ch-observability
  name: re8ch-grafana-postgresql
  namespace: observability-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: re8ch-grafana-postgresql
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: re8ch-grafana-postgresql
        app.kubernetes.io/part-of: re8ch-observability
    spec:
      containers:
      - env:
        - name: POSTGRES_DB
          valueFrom:
            secretKeyRef:
              key: name
              name: re8ch-grafana-database
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              key: user
              name: re8ch-grafana-database
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              key: password
              name: re8ch-grafana-database
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        image: docker.io/library/postgres@sha256:7c688148e5e156d0e86df7ba8ae5a05a2386aaec1e2ad8e6d11bdf10504b1fb7
        imagePullPolicy: IfNotPresent
        livenessProbe:
          exec:
            command:
            - sh
            - -ec
            - pg_isready -U $POSTGRES_USER -d $POSTGRES_DB
          initialDelaySeconds: 30
          periodSeconds: 15
        name: postgresql
        ports:
        - containerPort: 5432
          name: postgresql
        readinessProbe:
          exec:
            command:
            - sh
            - -ec
            - pg_isready -U $POSTGRES_USER -d $POSTGRES_DB
          periodSeconds: 5
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 50m
            memory: 128Mi
        volumeMounts:
        - mountPath: /var/lib/postgresql/data
          name: data
      nodeSelector:
        kubernetes.io/hostname: r640
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: re8ch-grafana-postgresql-data-v2
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: re8ch-grafana-renderer
    app.kubernetes.io/part-of: re8ch-observability
  name: re8ch-grafana-renderer
  namespace: observability-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: re8ch-grafana-renderer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: re8ch-grafana-renderer
        app.kubernetes.io/part-of: re8ch-observability
    spec:
      containers:
      - env:
        - name: AUTH_TOKEN
          valueFrom:
            secretKeyRef:
              key: token
              name: re8ch-grafana-renderer-auth
        image: docker.io/grafana/grafana-image-renderer@sha256:1ce46b1c24c873f637e69ed36e55553ab4e81373590f71c9ff52af134b715e4d
        livenessProbe:
          httpGet:
            path: /render/version
            port: http
          initialDelaySeconds: 30
          periodSeconds: 30
        name: renderer
        ports:
        - containerPort: 8081
          name: http
        readinessProbe:
          httpGet:
            path: /render/version
            port: http
          initialDelaySeconds: 10
          periodSeconds: 10
        resources:
          limits:
            cpu: '1'
            memory: 1Gi
          requests:
            cpu: 250m
            memory: 512Mi
      serviceAccountName: re8ch-grafana
---
apiVersion: batch/v1
kind: CronJob
metadata:
  labels:
    app.kubernetes.io/part-of: re8ch-observability
  name: re8ch-grafana-org-sync
  namespace: observability-system
spec:
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 3
      template:
        metadata:
          labels:
            app.kubernetes.io/name: re8ch-grafana-org-sync
        spec:
          containers:
          - command:
            - python3
            - /contract/sync.py
            env:
            - name: GRAFANA_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  key: user
                  name: re8ch-grafana-admin
            - name: GRAFANA_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: password
                  name: re8ch-grafana-admin
            image: registry.re8ch.com/helm/connectool-ci-tools@sha256:b4769df9cbd6fc7c9e64b4a77a52752de8f5454a45fa0cd2ba2dded71d0c884d
            name: sync
            resources:
              limits:
                cpu: 100m
                memory: 128Mi
              requests:
                cpu: 10m
                memory: 32Mi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                - ALL
              readOnlyRootFilesystem: true
            volumeMounts:
            - mountPath: /contract
              name: contract
              readOnly: true
          restartPolicy: OnFailure
          serviceAccountName: re8ch-grafana
          volumes:
          - configMap:
              defaultMode: 292
              name: re8ch-grafana-org-contract
            name: contract
  schedule: 17 * * * *
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: re8ch-grafana-from-gateway
  namespace: observability-system
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: re8ch-grafana
  ingress:
  - fromEntities:
    - ingress
    toPorts:
    - ports:
      - port: '3000'
        protocol: TCP
---
apiVersion: v1
data:
  dashboards.yaml: "apiVersion: 1\nproviders:\n  - name: re8ch\n    orgId: 1\n   \
    \ folder: RE8CH\n    type: file\n    disableDeletion: true\n    updateIntervalSeconds:\
    \ 30\n    options: {path: /var/lib/grafana/dashboards}\n"
kind: ConfigMap
metadata:
  name: re8ch-grafana-dashboard-providers
  namespace: observability-system
---
apiVersion: v1
data:
  orgs.json: '{"orgs":[{"name":"RE8CH Platform","group":"re8ch:k8s-admins","role":"Admin"},{"name":"Qianwen","group":"re8ch:qwen-operators","role":"Viewer"},{"name":"Ledger","group":"re8ch:ledger-operators","role":"Viewer"},{"name":"Anycam","group":"re8ch:anycam-operators","role":"Viewer"},{"name":"Bench","group":"re8ch:bench-operators","role":"Viewer"},{"name":"Cardcat","group":"re8ch:cardcat-operators","role":"Viewer"}]}

    '
  sync.py: "import base64, json, os, urllib.error, urllib.request\nendpoint = \"http://re8ch-grafana.observability-system.svc.cluster.local:3000/api\"\
    \nauth = base64.b64encode((os.environ[\"GRAFANA_ADMIN_USER\"] + \":\" + os.environ[\"\
    GRAFANA_ADMIN_PASSWORD\"]).encode()).decode()\nheaders = {\"Authorization\": \"\
    Basic \" + auth, \"Content-Type\": \"application/json\"}\ndef request(path, method=\"\
    GET\", body=None):\n    data = json.dumps(body).encode() if body else None\n \
    \   return urllib.request.urlopen(urllib.request.Request(endpoint + path, data=data,\
    \ headers=headers, method=method), timeout=15)\nexisting = {item[\"name\"] for\
    \ item in json.load(request(\"/orgs\"))}\nfor org in json.load(open(\"/contract/orgs.json\"\
    ))[\"orgs\"]:\n    if org[\"name\"] not in existing:\n        request(\"/orgs\"\
    , \"POST\", {\"name\": org[\"name\"]})\n        print(\"created Grafana org\"\
    , org[\"name\"])\n"
kind: ConfigMap
metadata:
  labels:
    app.kubernetes.io/part-of: re8ch-observability
  name: re8ch-grafana-org-contract
  namespace: observability-system
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  labels:
    app.kubernetes.io/name: re8ch-grafana-postgresql
    app.kubernetes.io/part-of: re8ch-observability
  name: re8ch-grafana-postgresql-data-v2
  namespace: observability-system
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: local-path
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/name: re8ch-grafana
    app.kubernetes.io/part-of: re8ch-observability
  name: re8ch-grafana
  namespace: observability-system
spec:
  ports:
  - name: http
    port: 3000
    targetPort: http
  selector:
    app.kubernetes.io/name: re8ch-grafana
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/name: re8ch-grafana-postgresql
  name: re8ch-grafana-postgresql
  namespace: observability-system
spec:
  ports:
  - name: postgresql
    port: 5432
    targetPort: postgresql
  selector:
    app.kubernetes.io/name: re8ch-grafana-postgresql
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/name: re8ch-grafana-renderer
    app.kubernetes.io/part-of: re8ch-observability
  name: re8ch-grafana-renderer
  namespace: observability-system
spec:
  ports:
  - name: http
    port: 8081
    targetPort: http
  selector:
    app.kubernetes.io/name: re8ch-grafana-renderer
---
apiVersion: v1
automountServiceAccountToken: false
kind: ServiceAccount
metadata:
  labels:
    app.kubernetes.io/name: re8ch-grafana
    app.kubernetes.io/part-of: re8ch-observability
  name: re8ch-grafana
  namespace: observability-system
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: re8ch-grafana
  namespace: observability-system
spec:
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: toolhive-system
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: re8ch-grafana-renderer
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: re8ch-grafana-org-sync
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: tenant-infrastructure
      podSelector:
        matchLabels:
          app: tenant-provider-reconciler
  podSelector:
    matchLabels:
      app.kubernetes.io/name: re8ch-grafana
  policyTypes:
  - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: re8ch-grafana-postgresql
  namespace: observability-system
spec:
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: re8ch-grafana
    ports:
    - port: 5432
      protocol: TCP
  podSelector:
    matchLabels:
      app.kubernetes.io/name: re8ch-grafana-postgresql
  policyTypes:
  - Ingress
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: re8ch-grafana
  namespace: observability-system
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: re8ch-grafana
