---
apiVersion: batch/v1
kind: Job
metadata:
  labels:
    app.kubernetes.io/component: bootstrap-admin
    app.kubernetes.io/name: incidentrelay
  name: incidentrelay-bootstrap-admin-v3
  namespace: incidentrelay
spec:
  backoffLimit: 20
  template:
    metadata:
      labels:
        app.kubernetes.io/component: bootstrap-admin
        app.kubernetes.io/name: incidentrelay
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/hostname
                operator: NotIn
                values:
                - r640
      automountServiceAccountToken: false
      containers:
      - args:
        - "until python manage.py migration-status >/dev/null 2>&1; do\n  sleep 5\n\
          done\npython manage.py create-admin \\\n  --username \"$ADMIN_USERNAME\"\
          \ \\\n  --display-name \"$ADMIN_DISPLAY_NAME\" \\\n  --email \"$ADMIN_EMAIL\"\
          \ \\\n  --password \"$ADMIN_PASSWORD\"\n"
        command:
        - /bin/sh
        - -ec
        env:
        - name: INCIDENTRELAY_CONFIG_FILE
          value: /etc/incidentrelay/incidentrelay.conf
        - name: ADMIN_USERNAME
          valueFrom:
            secretKeyRef:
              key: username
              name: incidentrelay-bootstrap-admin
        - name: ADMIN_DISPLAY_NAME
          valueFrom:
            secretKeyRef:
              key: display-name
              name: incidentrelay-bootstrap-admin
        - name: ADMIN_EMAIL
          valueFrom:
            secretKeyRef:
              key: email
              name: incidentrelay-bootstrap-admin
        - name: ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              key: password
              name: incidentrelay-bootstrap-admin
        image: ghcr.io/roxy-wi/incidentrelay@sha256:5d3af4a530dbe38970caf1124133b01d422860893621a7ac8439551afef21b4a
        imagePullPolicy: IfNotPresent
        name: create-admin
        resources:
          limits:
            cpu: 250m
            memory: 256Mi
          requests:
            cpu: 25m
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - mountPath: /etc/incidentrelay
          name: config
          readOnly: true
      restartPolicy: OnFailure
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      volumes:
      - name: config
        secret:
          secretName: incidentrelay-config
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: incidentrelay-allow-node-proxy
  namespace: incidentrelay
spec:
  egress:
  - toEntities:
    - host
    toPorts:
    - ports:
      - port: '17891'
        protocol: TCP
  endpointSelector: {}
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: incidentrelay-from-gateway
  namespace: incidentrelay
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/component: web
      app.kubernetes.io/name: incidentrelay
  ingress:
  - fromEntities:
    - ingress
    toPorts:
    - ports:
      - port: '8080'
        protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: incidentrelay-pigsty
  namespace: incidentrelay
spec:
  egress:
  - toPorts:
    - ports:
      - port: '5432'
        protocol: TCP
    toServices:
    - k8sService:
        namespace: pigsty-external
        serviceName: pg-re8ch-primary
  - toEntities:
    - host
    - remote-node
    toPorts:
    - ports:
      - port: '5432'
        protocol: TCP
  endpointSelector: {}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: incidentrelay-http-redirect
  namespace: incidentrelay
spec:
  hostnames:
  - oncall.tools.re8ch.com
  parentRefs:
  - name: re8ch-gateway-canary
    namespace: kube-system
    sectionName: http
  rules:
  - filters:
    - requestRedirect:
        scheme: https
        statusCode: 308
      type: RequestRedirect
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: incidentrelay-public
  namespace: incidentrelay
spec:
  hostnames:
  - oncall.tools.re8ch.com
  parentRefs:
  - name: re8ch-gateway-canary
    namespace: kube-system
    sectionName: tools-wildcard-https
  rules:
  - backendRefs:
    - name: incidentrelay
      port: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    external-dns.alpha.kubernetes.io/cloudflare-proxied: 'false'
    external-dns.alpha.kubernetes.io/hostname: oncall.tools.re8ch.com
    external-dns.alpha.kubernetes.io/target: 223.159.210.222
    external-dns.alpha.kubernetes.io/ttl: '60'
    networking.re8ch.com/dns-authority: public-edge
    networking.re8ch.com/selected-public-edge: r640
  labels:
    networking.re8ch.com/dns-authority: public-edge
    public.re8ch.com/external-dns: enabled
  name: incidentrelay-public-dns-authority
  namespace: incidentrelay
spec:
  ingressClassName: external-dns-only
  rules:
  - host: oncall.tools.re8ch.com
    http:
      paths:
      - backend:
          service:
            name: incidentrelay
            port:
              number: 8080
        path: /
        pathType: Prefix
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: incidentrelay-allow-required
  namespace: incidentrelay
spec:
  egress:
  - ports:
    - port: 53
      protocol: UDP
    - port: 53
      protocol: TCP
    to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
  - ports:
    - port: 5432
      protocol: TCP
    to:
    - ipBlock:
        cidr: 10.250.0.128/32
  - ports:
    - port: 17891
      protocol: TCP
    to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: egress-fabric
    - ipBlock:
        cidr: 10.181.22.0/24
    - ipBlock:
        cidr: 10.250.0.0/16
  - ports:
    - port: 443
      protocol: TCP
    to:
    - ipBlock:
        cidr: 0.0.0.0/0
  ingress:
  - from:
    - namespaceSelector:
        matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: In
          values:
          - kube-system
          - observability-system
          - qianwen-ops
          - re8ch-secretary
    ports:
    - port: 8080
      protocol: TCP
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: incidentrelay-default-deny
  namespace: incidentrelay
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
