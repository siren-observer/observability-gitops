---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: harbor-supply-chain-credentials
  namespace: credential-broker
rules:
- apiGroups:
  - ''
  resources:
  - secrets
  verbs:
  - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: harbor-supply-chain-credentials
  namespace: credential-broker
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: harbor-supply-chain-credentials
subjects:
- kind: ServiceAccount
  name: harbor-supply-chain
  namespace: tenant-infrastructure
