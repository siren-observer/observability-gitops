---
apiVersion: batch/v1
kind: Job
metadata:
  labels:
    app.kubernetes.io/component: database-bootstrap
    app.kubernetes.io/name: incidentrelay
  name: incidentrelay-database-bootstrap-v7
  namespace: supabase-pg-re8ch
spec:
  backoffLimit: 20
  template:
    metadata:
      labels:
        app.kubernetes.io/component: database-bootstrap
        app.kubernetes.io/name: incidentrelay
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/hostname
                operator: NotIn
                values:
                - r640
      automountServiceAccountToken: false
      containers:
      - args:
        - "export PGPASSWORD=\"$POSTGRES_ADMIN_PASSWORD\"\nuntil pg_isready -h pg-re8ch-primary.pigsty-external.svc.cluster.local\
          \ -p 5432 -U \"$POSTGRES_ADMIN_USER\"; do\n  sleep 5\ndone\npsql -v ON_ERROR_STOP=1\
          \ \\\n  -h pg-re8ch-primary.pigsty-external.svc.cluster.local -p 5432 \\\
          \n  -U \"$POSTGRES_ADMIN_USER\" -d postgres \\\n  -v app_password=\"$INCIDENTRELAY_DB_PASSWORD\"\
          \ \\\n  -v admin_user=\"$POSTGRES_ADMIN_USER\" <<'SQL'\nSELECT format('CREATE\
          \ ROLE incidentrelay LOGIN PASSWORD %L', :'app_password')\n  WHERE NOT EXISTS\
          \ (SELECT 1 FROM pg_roles WHERE rolname = 'incidentrelay')\\gexec\nSELECT\
          \ format('ALTER ROLE incidentrelay WITH LOGIN PASSWORD %L', :'app_password')\\\
          gexec\nGRANT incidentrelay TO :\"admin_user\";\nSELECT 'CREATE DATABASE\
          \ incidentrelay OWNER incidentrelay TEMPLATE template0 ENCODING ''UTF8'''\n\
          \  WHERE NOT EXISTS (SELECT 1 FROM pg_database WHERE datname = 'incidentrelay')\\\
          gexec\nREVOKE ALL ON DATABASE incidentrelay FROM PUBLIC;\nGRANT CONNECT,\
          \ TEMPORARY, CREATE ON DATABASE incidentrelay TO incidentrelay;\nREVOKE\
          \ incidentrelay FROM :\"admin_user\";\nSQL\n"
        command:
        - /bin/sh
        - -ec
        env:
        - name: POSTGRES_ADMIN_USER
          valueFrom:
            secretKeyRef:
              key: POSTGRES_USER_READ_WRITE
              name: supabase-pg-re8ch-secrets
        - name: POSTGRES_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              key: POSTGRES_PASSWORD
              name: supabase-pg-re8ch-secrets
        - name: INCIDENTRELAY_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              key: password
              name: incidentrelay-db-bootstrap
        image: docker.io/library/postgres@sha256:7c688148e5e156d0e86df7ba8ae5a05a2386aaec1e2ad8e6d11bdf10504b1fb7
        imagePullPolicy: IfNotPresent
        name: create-database
        resources:
          limits:
            cpu: 250m
            memory: 256Mi
          requests:
            cpu: 25m
            memory: 32Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
      restartPolicy: OnFailure
      securityContext:
        runAsGroup: 999
        runAsNonRoot: true
        runAsUser: 999
        seccompProfile:
          type: RuntimeDefault
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: supabase-one-cpu
  namespace: supabase-pg-re8ch
spec:
  hard:
    limits.cpu: 1250m
    limits.memory: 4096Mi
    requests.cpu: 500m
    requests.memory: 1280Mi
