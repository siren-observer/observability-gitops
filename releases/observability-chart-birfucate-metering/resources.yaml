    PATCH\", f\"{base}/{name}/status\", {\"status\": status}, \"application/merge-patch+json\"\
    )\n        return saved\n\n    def delete(self, plural, namespace, name):\n  \
    \      base = f\"/apis/{GROUP}/{VERSION}/namespaces/{namespace}/{plural}/{name}\"\
    \n        return self.request(\"DELETE\", base, {\"apiVersion\": \"v1\", \"kind\"\
    : \"DeleteOptions\", \"propagationPolicy\": \"Background\"})\n\n    def patch_status(self,\
    \ plural, namespace, name, status):\n        base = f\"/apis/{GROUP}/{VERSION}/namespaces/{namespace}/{plural}/{name}/status\"\
    \n        return self.request(\"PATCH\", base, {\"status\": status}, \"application/merge-patch+json\"\
    )\n\n\ndef reconcile(kube, config):\n    resources = {\"pods\": kube.list(\"v1\"\
    , \"pods\"), \"services\": kube.list(\"v1\", \"services\"), \"persistentvolumeclaims\"\
    : kube.list(\"v1\", \"persistentvolumeclaims\"), \"httproutes\": kube.list(\"\
    gateway.networking.k8s.io/v1\", \"httproutes\")}\n    bindings = kube.list(f\"\
    {GROUP}/{VERSION}\", \"consumptionbindings\")\n    claims = kube.list(\"tenancy.re8ch.com/v1alpha1\"\
    , \"tenantresourceclaims\")\n    claims_by_uid = {item[\"metadata\"][\"uid\"]:\
    \ item for item in claims if item.get(\"spec\", {}).get(\"desiredState\", \"Active\"\
    ) == \"Active\" or item.get(\"spec\", {}).get(\"capability\") == \"storage.volume.v1\"\
    }\n    consumables = {x[\"metadata\"][\"name\"]: x for x in kube.list(f\"{GROUP}/{VERSION}\"\
    , \"consumables\")}\n    count = 0\n    desired = set()\n    for api, plural,\
    \ kind in WORKLOADS:\n        for workload in kube.list(api, plural):\n      \
    \      workload[\"kind\"] = kind\n            shard = shard_for(workload, resources,\
    \ config)\n            claim_uid = workload.get(\"metadata\", {}).get(\"labels\"\
    , {}).get(\"tenancy.re8ch.com/claim-uid\")\n            if claim_uid in claims_by_uid:\n\
    \                binding = derived_binding(claims_by_uid[claim_uid], shard)\n\
    \                binding = kube.apply(\"consumptionbindings\", binding)\n    \
    \            bindings = [x for x in bindings if x[\"metadata\"][\"name\"] != binding[\"\
    metadata\"][\"name\"]] + [binding]\n            else:\n                binding\
    \ = next((x for x in bindings if x[\"metadata\"].get(\"namespace\") == shard[\"\
    metadata\"][\"namespace\"] and shard[\"metadata\"][\"name\"] in x.get(\"spec\"\
    , {}).get(\"shardRefs\", [])), None)\n            desired.add((shard[\"metadata\"\
    ][\"namespace\"], shard[\"metadata\"][\"name\"]))\n            kube.apply(\"serviceshards\"\
    , shard)\n            kube.apply(\"bifurcationpaths\", path_for(shard, binding))\n\
    \            count += 1\n    for pvc in resources[\"persistentvolumeclaims\"]:\n\
    \        claim_uid = pvc.get(\"metadata\", {}).get(\"labels\", {}).get(\"tenancy.re8ch.com/claim-uid\"\
    )\n        claim = claims_by_uid.get(claim_uid)\n        if not claim or claim.get(\"\
    spec\", {}).get(\"capability\") != \"storage.volume.v1\":\n            continue\n\
    \        shard = volume_shard_for(pvc, claim, config)\n        binding = kube.apply(\"\
    consumptionbindings\", derived_binding(claim, shard))\n        bindings = [x for\
    \ x in bindings if x[\"metadata\"][\"name\"] != binding[\"metadata\"][\"name\"\
    ]] + [binding]\n        desired.add((shard[\"metadata\"][\"namespace\"], shard[\"\
    metadata\"][\"name\"]))\n        kube.apply(\"serviceshards\", shard)\n      \
    \  kube.apply(\"bifurcationpaths\", path_for(shard, binding))\n        count +=\
    \ 1\n    for existing in kube.list(f\"{GROUP}/{VERSION}\", \"serviceshards\"):\n\
    \        meta = existing[\"metadata\"]\n        key = (meta[\"namespace\"], meta[\"\
    name\"])\n        if meta.get(\"labels\", {}).get(\"app.kubernetes.io/managed-by\"\
    ) != \"birfucate-discovery\" or key in desired:\n            continue\n      \
    \  if FINALIZER in meta.get(\"finalizers\", []):\n            kube.request(\"\
    PATCH\", f\"/apis/{GROUP}/{VERSION}/namespaces/{key[0]}/serviceshards/{key[1]}\"\
    , {\"metadata\": {\"finalizers\": []}}, \"application/merge-patch+json\")\n  \
    \      kube.delete(\"bifurcationpaths\", key[0], key[1])\n        kube.delete(\"\
    serviceshards\", key[0], key[1])\n    now = time.strftime(\"%Y-%m-%dT%H:%M:%SZ\"\
    , time.gmtime())\n    for binding in bindings:\n        spec, meta = binding.get(\"\
    spec\", {}), binding[\"metadata\"]\n        consumable = consumables.get(spec.get(\"\
    consumableRef\"))\n        approved = bool(consumable and consumable.get(\"spec\"\
    , {}).get(\"lifecycle\") == \"Approved\")\n        resolved = all((meta[\"namespace\"\
    ], name) in desired for name in spec.get(\"shardRefs\", []))\n        access_ok,\
    \ access_reason = access_valid(binding, consumable)\n        ready = approved\
    \ and resolved and access_ok\n        reason = \"Ready\" if ready else \"OfferingNotApproved\"\
    \ if not approved else \"ShardNotFound\" if not resolved else access_reason\n\
    \        status = {\"observedGeneration\": meta.get(\"generation\", 1), \"phase\"\
    : \"Ready\" if ready else \"Pending\", \"conditions\": [{\"type\": \"Ready\",\
    \ \"status\": \"True\" if ready else \"False\", \"reason\": reason, \"lastTransitionTime\"\
    : now}]}\n        current = binding.get(\"status\", {})\n        if current.get(\"\
    phase\") != status[\"phase\"] or [(x.get(\"type\"), x.get(\"status\"), x.get(\"\
    reason\")) for x in current.get(\"conditions\", [])] != [(\"Ready\", status[\"\
    conditions\"][0][\"status\"], reason)]:\n            kube.patch_status(\"consumptionbindings\"\
    , meta[\"namespace\"], meta[\"name\"], status)\n    return count\n\n\ndef main():\n\
    \    config = json.load(open(os.environ.get(\"BIFURCATE_DISCOVERY_CONFIG\", \"\
    /etc/birfucate/discovery.json\")))\n    kube = Kubernetes()\n    while True:\n\
    \        try:\n            count = reconcile(kube, config)\n            print(json.dumps({\"\
    event\": \"reconciled\", \"workloads\": count}), flush=True)\n        except Exception\
    \ as exc:\n            print(json.dumps({\"event\": \"reconcile_failed\", \"error\"\
    : str(exc)}), flush=True)\n        time.sleep(config.get(\"intervalSeconds\",\
    \ 120))\n\n\nif __name__ == \"__main__\":\n    main()\n"
