  collector.py: "#!/usr/bin/env python3\n\"\"\"Prometheus-backed Occupancy and Bifurcation\
    \ usage collector.\"\"\"\n\nfrom __future__ import annotations\n\nimport hashlib\n\
    import json\nimport math\nimport os\nimport sqlite3\nimport threading\nimport\
    \ time\nimport urllib.error\nimport urllib.parse\nimport urllib.request\nfrom\
    \ http.server import BaseHTTPRequestHandler, ThreadingHTTPServer\nfrom pathlib\
    \ import Path\nfrom typing import Any\n\nCONFIG_PATH = Path(os.getenv(\"BIRFUCATE_CONFIG\"\
    , \"/etc/birfucate/config.json\"))\nOUTBOX_PATH = Path(os.getenv(\"BIRFUCATE_OUTBOX\"\
    , \"/var/lib/birfucate/outbox.db\"))\nUSAGE_TOKEN_PATH = Path(os.getenv(\"BIRFUCATE_USAGE_TOKEN_PATH\"\
    , \"/var/run/secrets/re8ch-usage/token\"))\nLOCK = threading.Lock()\nMETRICS:\
    \ dict[tuple[str, tuple[tuple[str, str], ...]], float] = {}\nREADY = False\nLAST_SUCCESS\
    \ = 0.0\nBROWSER_METRICS = frozenset({\n    \"birfucate_occupancy_current\",\n\
    \    \"birfucate_occupancy_units_total\",\n    \"birfucate_usage_total\",\n  \
    \  \"birfucate_bifurcation_occurrences_total\",\n    \"birfucate_bifurcation_intensity\"\
    ,\n    \"birfucate_bifurcation_fanout\",\n    \"birfucate_bifurcation_score_total\"\
    ,\n    \"birfucate_metered_cost_total\",\n    \"birfucate_tenant_cost_total\"\
    ,\n    \"birfucate_unallocated_cost_total\",\n    \"birfucate_tenant_resource_count\"\
    ,\n})\n\n\ndef load_config() -> dict[str, Any]:\n    return json.loads(CONFIG_PATH.read_text())\n\
    \n\ndef prometheus_query(base_url: str, query: str, timeout: int) -> list[dict[str,\
    \ Any]]:\n    url = base_url.rstrip(\"/\") + \"/api/v1/query?\" + urllib.parse.urlencode({\"\
    query\": query})\n    request = urllib.request.Request(url, headers={\"Accept\"\
