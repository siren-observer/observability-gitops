apiVersion: apps/v1
kind: Deployment
metadata:
  name: birfucate-metering
  labels:
    app.kubernetes.io/name: birfucate-metering
    app.kubernetes.io/instance: birfucate-metering
    app.kubernetes.io/version: 0.4.0
    app.kubernetes.io/managed-by: Helm
  namespace: observability-ai
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: birfucate-metering
      app.kubernetes.io/instance: birfucate-metering
  template:
    metadata:
      annotations:
        checksum/collector: 6721cc7678fe7048f415e7878d17e308d4160be5d12207b4f63177f272fc2281
        checksum/config: 3038ac5a6403e7015d15cb79058c25d4156f876bc1586911c957157eb9a4e615
      labels:
        app.kubernetes.io/name: birfucate-metering
        app.kubernetes.io/instance: birfucate-metering
        app.kubernetes.io/version: 0.4.0
        app.kubernetes.io/managed-by: Helm
    spec:
      serviceAccountName: birfucate-metering
      automountServiceAccountToken: false
      dnsPolicy: None
      dnsConfig:
        nameservers:
        - 10.43.0.53
        searches:
        - observability-ai.svc.cluster.local
        - tenant-infrastructure.svc.cluster.local
        - svc.cluster.local
        - cluster.local
        options:
        - name: ndots
          value: '5'
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: collector
        image: python:3.13-alpine@sha256:540c7d91f98ff6880174c40e99067bf5941eb54d818a7a5e094d188b196a934d
        imagePullPolicy: IfNotPresent
        command:
        - python3
        - /etc/birfucate/collector.py
        env:
        - name: BIRFUCATE_CONFIG
          value: /etc/birfucate/config.json
        - name: BIRFUCATE_OUTBOX
          value: /var/lib/birfucate/outbox.db
        ports:
        - name: metrics
          containerPort: 9791
        readinessProbe:
          httpGet:
            path: /readyz
            port: metrics
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /healthz
            port: metrics
          periodSeconds: 30
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          limits:
            cpu: 500m
            memory: 256Mi
          requests:
            cpu: 25m
            memory: 64Mi
        volumeMounts:
        - name: config
          mountPath: /etc/birfucate
          readOnly: true
        - name: state
          mountPath: /var/lib/birfucate
        - name: tmp
          mountPath: /tmp
        - name: usage-token
          mountPath: /var/run/secrets/re8ch-usage
          readOnly: true
      volumes:
      - name: config
        configMap:
          name: birfucate-metering
          defaultMode: 292
      - name: state
        emptyDir: {}
      - name: tmp
        emptyDir: {}
      - name: usage-token
        projected:
          sources:
          - serviceAccountToken:
              path: token
              audience: re8ch-usage
              expirationSeconds: 3600
      nodeSelector:
        kubernetes.io/hostname: r640
      tolerations: []
      affinity: {}
