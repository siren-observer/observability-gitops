---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: k6-contracts
  namespace: synthetic-monitoring
spec:
  concurrencyPolicy: Forbid
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      activeDeadlineSeconds: 180
      backoffLimit: 0
      template:
        spec:
          automountServiceAccountToken: false
          containers:
          - args:
            - run
            - /work/smoke.js
            env:
            - name: PROBE_VANTAGE
              value: internal
            - name: PROBE_CADENCE
              value: standard
            image: grafana/k6:1.3.0@sha256:3ddc8b1a33a2c3d8edc6e99b6a762ae36cba08788463458f5e6a7703e14eb77d
            name: k6
            resources:
              limits:
                cpu: 250m
                memory: 256Mi
              requests:
                cpu: 25m
                memory: 64Mi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                - ALL
              readOnlyRootFilesystem: true
            volumeMounts:
            - mountPath: /work
              name: contracts
              readOnly: true
            - mountPath: /tmp
              name: scratch
            workingDir: /work
          restartPolicy: Never
          securityContext:
            runAsGroup: 10001
            runAsNonRoot: true
            runAsUser: 10001
            seccompProfile:
              type: RuntimeDefault
          serviceAccountName: k6-contracts
          volumes:
          - configMap:
              name: k6-contracts-96kmtdg46c
            name: contracts
          - emptyDir:
              sizeLimit: 16Mi
            name: scratch
      ttlSecondsAfterFinished: 604800
  schedule: 20,50 * * * *
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 2
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: k6-contracts-fast
  namespace: synthetic-monitoring
spec:
  concurrencyPolicy: Forbid
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      activeDeadlineSeconds: 180
      backoffLimit: 0
      template:
        spec:
          automountServiceAccountToken: false
          containers:
          - args:
            - run
            - /work/smoke.js
            env:
            - name: PROBE_VANTAGE
              value: internal
            - name: PROBE_CADENCE
              value: fast
            image: grafana/k6:1.3.0@sha256:3ddc8b1a33a2c3d8edc6e99b6a762ae36cba08788463458f5e6a7703e14eb77d
            name: k6
            resources:
              limits:
                cpu: 250m
                memory: 256Mi
              requests:
                cpu: 25m
                memory: 64Mi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                - ALL
              readOnlyRootFilesystem: true
            volumeMounts:
            - mountPath: /work
              name: contracts
              readOnly: true
            - mountPath: /tmp
              name: scratch
            workingDir: /work
          restartPolicy: Never
          securityContext:
            runAsGroup: 10001
            runAsNonRoot: true
            runAsUser: 10001
            seccompProfile:
              type: RuntimeDefault
          serviceAccountName: k6-contracts
          volumes:
          - configMap:
              name: k6-contracts-96kmtdg46c
            name: contracts
          - emptyDir:
              sizeLimit: 16Mi
            name: scratch
      ttlSecondsAfterFinished: 604800
  schedule: 4/5 * * * *
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 2
---
apiVersion: v1
data:
  contracts.json: "{\n  \"version\": 2,\n  \"cadences\": {\n    \"fast\": {\n    \
    \  \"periodSeconds\": 300,\n      \"externalCron\": \"2/5 * * * *\",\n      \"\
    internalCron\": \"4/5 * * * *\"\n    },\n    \"standard\": {\n      \"periodSeconds\"\
    : 1800,\n      \"externalCron\": \"18,48 * * * *\",\n      \"internalCron\": \"\
    20,50 * * * *\"\n    }\n  },\n  \"probes\": [\n    {\n      \"id\": \"auth-discovery\"\
    ,\n      \"owner\": \"platform/identity-access\",\n      \"vantage\": \"external\"\
    ,\n      \"cadence\": \"standard\",\n      \"url\": \"https://auth.re8ch.com/.well-known/openid-configuration\"\
    ,\n      \"status\": 200,\n      \"jsonField\": \"issuer\",\n      \"equals\"\
    : \"https://auth.re8ch.com\"\n    },\n    {\n      \"id\": \"cloud-mcp-auth-challenge\"\
    ,\n      \"owner\": \"platform/cloud-platform\",\n      \"vantage\": \"external\"\
    ,\n      \"cadence\": \"fast\",\n      \"url\": \"https://tools.service.re8ch.com/cloud/mcp\"\
    ,\n      \"accept\": \"application/json, text/event-stream\",\n      \"status\"\
    : 401,\n      \"header\": \"Www-Authenticate\",\n      \"contains\": \"Bearer\"\
    \n    },\n    {\n      \"id\": \"id-discovery\",\n      \"owner\": \"platform/identity-access\"\
    ,\n      \"vantage\": \"external\",\n      \"cadence\": \"standard\",\n      \"\
    url\": \"https://id.re8ch.com/.well-known/openid-configuration\",\n      \"status\"\
    : 200,\n      \"jsonField\": \"issuer\",\n      \"equals\": \"https://id.re8ch.com\"\
    \n    },\n    {\n      \"id\": \"registry-auth-challenge\",\n      \"owner\":\
    \ \"platform/registry\",\n      \"vantage\": \"external\",\n      \"cadence\"\
    : \"fast\",\n      \"url\": \"https://registry.re8ch.com/v2/\",\n      \"status\"\
    : 401,\n      \"header\": \"Www-Authenticate\",\n      \"contains\": \"Bearer\"\
    \n    },\n    {\n      \"id\": \"grafana-health\",\n      \"owner\": \"platform/observability\"\
    ,\n      \"vantage\": \"external\",\n      \"cadence\": \"standard\",\n      \"\
    url\": \"https://grafana.service.re8ch.com/grafana/api/health\",\n      \"status\"\
    : 200,\n      \"jsonField\": \"database\",\n      \"equals\": \"ok\"\n    },\n\
    \    {\n      \"id\": \"cloud-platform-internal-health\",\n      \"owner\": \"\
    platform/cloud-platform\",\n      \"vantage\": \"internal\",\n      \"cadence\"\
    : \"fast\",\n      \"url\": \"http://re8ch-cloud-platform.ai-operations.svc.cluster.local:19443/healthz\"\
    ,\n      \"status\": 200\n    },\n    {\n      \"id\": \"auth-gateway-internal-health\"\
    ,\n      \"owner\": \"platform/identity-access\",\n      \"vantage\": \"internal\"\
    ,\n      \"cadence\": \"standard\",\n      \"url\": \"http://re8ch-auth-gateway.auth.svc.cluster.local:8080/auth/healthz\"\
    ,\n      \"status\": 200\n    }\n  ]\n}\n"
  smoke.js: "import http from 'k6/http';\nimport { check } from 'k6';\nimport { Rate\
    \ } from 'k6/metrics';\nimport exec from 'k6/execution';\n\nconst catalog = JSON.parse(open('./contracts.json'));\n\
    const contractFailures = new Rate('contract_failures');\nconst vantage = __ENV.PROBE_VANTAGE\
    \ || 'external';\nconst cadence = __ENV.PROBE_CADENCE || 'all';\nconst probes\
    \ = catalog.probes.filter((probe) =>\n  probe.vantage === vantage && (cadence\
    \ === 'all' || probe.cadence === cadence));\nconst expectedStatuses = Object.fromEntries(\n\
    \  [...new Set(probes.map((probe) => probe.status))].map((status) => [status,\
    \ http.expectedStatuses(status)]));\nif (probes.length === 0) {\n  throw new Error(`No\
    \ probes for ${vantage}/${cadence}`);\n}\n\nexport const options = {\n  scenarios:\
    \ {\n    smoke: { executor: 'shared-iterations', vus: 1, iterations: 3, maxDuration:\
    \ '2m' },\n  },\n  thresholds: {\n    contract_failures: ['rate==0'],\n    http_req_duration:\
    \ ['p(95)<15000'],\n  },\n};\n\nexport default function () {\n  for (const probe\
    \ of probes) {\n    const runID = `${Date.now()}-${exec.scenario.iterationInTest}`;\n\
    \    const response = http.get(probe.url, {\n      headers: {\n        ...(probe.accept\
    \ ? { Accept: probe.accept } : {}),\n        'X-Observable-Synthetic': 'true',\n\
    \        'X-Observable-Run-ID': runID,\n        'X-Observable-Journey': probe.id,\n\
    \        'X-Observable-Agent': 'robot',\n        'X-Observable-Load-Class': 'probe',\n\
    \        baggage: `synthetic_request=true,observable.journey=${probe.id},observable.agent=robot,observable.load_class=probe`,\n\
    \      },\n      redirects: 0,\n      timeout: '15s',\n      responseCallback:\
    \ expectedStatuses[probe.status],\n      tags: { probe: probe.id, owner: probe.owner,\
    \ vantage, cadence: probe.cadence, load_class: 'probe' },\n    });\n    let valid\
    \ = response.status === probe.status;\n    if (valid && probe.jsonField) {\n \
    \     try {\n        valid = response.json(probe.jsonField) === probe.equals;\n\
    \      } catch (_) {\n        valid = false;\n      }\n    }\n    if (valid &&\
    \ probe.header) {\n      valid = String(response.headers[probe.header] || '').includes(probe.contains);\n\
    \    }\n    contractFailures.add(!valid, { probe: probe.id });\n    check(response,\
    \ { [`${probe.id} contract`]: () => valid }, { probe: probe.id });\n  }\n}\n"
kind: ConfigMap
metadata:
  name: k6-contracts-96kmtdg46c
  namespace: synthetic-monitoring
---
apiVersion: v1
automountServiceAccountToken: false
kind: ServiceAccount
metadata:
  name: k6-contracts
  namespace: synthetic-monitoring
