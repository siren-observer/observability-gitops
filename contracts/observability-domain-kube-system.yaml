apiVersion: delivery.re8ch.com/v1alpha1
kind: ReleaseContract
metadata:
  name: observability-domain-kube-system
spec:
  authorityDomain: observability-metering
  target:
    cluster: re8ch
    namespace: kube-system
  source:
    renderer: kustomize
    revision: github-main-reviewed
    repository: siren-observer/observability-gitops
    path: releases/observability-domain-kube-system
  provenance:
    repository: siren-observer/observability-gitops
    workflow: .github/workflows/static-release.yml
    ref: refs/heads/main
    environment: release-executor-observability-metering
    audience: https://kube-api.re8ch.com/release-executor-observability-metering
    signer: https://github.com/siren-observer/observability-gitops/.github/workflows/static-release.yml@refs/heads/main
    issuer: https://token.actions.githubusercontent.com
  authorization:
    fieldManager: re8ch-release/observability-domain-kube-system
    resources:
    - policy/PodDisruptionBudget
    objectNames:
    - kube-state-metrics
    allowClusterScoped: false
    requireExisting: true
    forceConflictObjects:
    - policy/PodDisruptionBudget/kube-system/kube-state-metrics
  inventory:
    digest: sha256:83be1e193c93cfcd2b924bc0401bcdcd1fae66e2cad2fa2fad6028b122f9a30f
  lifecycle:
    prune: false
    healthTimeoutSeconds: 300
    protectedKinds:
    - Namespace
    - CustomResourceDefinition
    - PersistentVolume
    - PersistentVolumeClaim
    - StorageClass
    deletionAllowlist: []
