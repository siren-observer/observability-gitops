apiVersion: delivery.re8ch.com/v1alpha1
kind: ReleaseContract
metadata:
  name: observability-domain-opencost
spec:
  authorityDomain: observability-metering
  target:
    cluster: re8ch
    namespace: opencost
  source:
    renderer: kustomize
    revision: github-main-reviewed
    repository: siren-observer/observability-gitops
    path: releases/observability-domain-opencost
  provenance:
    repository: siren-observer/observability-gitops
    workflow: .github/workflows/static-release.yml
    ref: refs/heads/main
    environment: release-executor-observability-metering
    audience: https://kube-api.re8ch.com/release-executor-observability-metering
    signer: https://github.com/siren-observer/observability-gitops/.github/workflows/static-release.yml@refs/heads/main
    issuer: https://token.actions.githubusercontent.com
  authorization:
    fieldManager: re8ch-release/observability-domain-opencost
    resources:
    - core/ConfigMap
    objectNames:
    - opencost-ui-nginx-config
    allowClusterScoped: false
    forceConflictObjects:
    - core/ConfigMap/opencost/opencost-ui-nginx-config
  inventory:
    digest: sha256:178813af4f8a1e253675b74b41374d0e98149320635f46fe8b5ee2378afc8697
  lifecycle:
    prune: false
    healthTimeoutSeconds: 300
    protectedKinds:
    - Namespace
    - CustomResourceDefinition
    - PersistentVolume
    - PersistentVolumeClaim
    - StorageClass
    deletionAllowlist: []
