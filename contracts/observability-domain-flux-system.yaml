apiVersion: delivery.re8ch.com/v1alpha1
kind: ReleaseContract
metadata:
  name: observability-domain-flux-system
spec:
  authorityDomain: observability-metering
  target:
    cluster: re8ch
    namespace: flux-system
  source:
    renderer: kustomize
    revision: github-main-reviewed
    repository: siren-observer/observability-gitops
    path: releases/observability-domain-flux-system
  provenance:
    repository: siren-observer/observability-gitops
    workflow: .github/workflows/static-release.yml
    ref: refs/heads/main
    environment: release-executor-observability-metering
    audience: https://kube-api.re8ch.com/release-executor-observability-metering
    signer: https://github.com/siren-observer/observability-gitops/.github/workflows/static-release.yml@refs/heads/main
    issuer: https://token.actions.githubusercontent.com
  authorization:
    fieldManager: re8ch-release/observability-domain-flux-system
    resources:
    - core/ServiceAccount
    objectNames:
    - retire-legacy-qianwen-grafana
    allowClusterScoped: false
    requireExisting: true
    forceConflictObjects:
    - core/ServiceAccount/flux-system/retire-legacy-qianwen-grafana
  inventory:
    digest: sha256:8e08de1877517dbca8f769abd930efb1d41fcf6bc980c32878a6a753061237cd
  lifecycle:
    prune: false
    healthTimeoutSeconds: 300
    protectedKinds:
    - Namespace
    - CustomResourceDefinition
    - PersistentVolume
    - PersistentVolumeClaim
    - StorageClass
    deletionAllowlist: []
