apiVersion: delivery.re8ch.com/v1alpha1
kind: ReleaseContract
metadata:
  name: observability-domain-tenant-infrastructure
spec:
  authorityDomain: observability-metering
  target:
    cluster: re8ch
    namespace: tenant-infrastructure
  source:
    renderer: kustomize
    revision: github-main-reviewed
    repository: siren-observer/observability-gitops
    path: releases/observability-domain-tenant-infrastructure
  provenance:
    repository: siren-observer/observability-gitops
    workflow: .github/workflows/static-release.yml
    ref: refs/heads/main
    environment: release-executor-observability-metering
    audience: https://kube-api.re8ch.com/release-executor-observability-metering
    signer: https://github.com/siren-observer/observability-gitops/.github/workflows/static-release.yml@refs/heads/main
    issuer: https://token.actions.githubusercontent.com
  authorization:
    fieldManager: re8ch-release/observability-domain-tenant-infrastructure
    resources:
    - apps/Deployment
    - core/ConfigMap
    - core/PersistentVolumeClaim
    - core/Service
    - core/ServiceAccount
    objectNames:
    - harbor-supply-chain
    - harbor-supply-chain-buildkit
    - harbor-supply-chain-state
    allowClusterScoped: false
    forceConflictObjects:
    - apps/Deployment/tenant-infrastructure/harbor-supply-chain
    - core/ConfigMap/tenant-infrastructure/harbor-supply-chain-buildkit
    - core/PersistentVolumeClaim/tenant-infrastructure/harbor-supply-chain-state
    - core/Service/tenant-infrastructure/harbor-supply-chain
    - core/ServiceAccount/tenant-infrastructure/harbor-supply-chain
  inventory:
    digest: sha256:a995d7a1aca7ec2e9fa293e6f82708a7b5ffdc94915c08f7f28c2bfc70458521
  lifecycle:
    prune: false
    healthTimeoutSeconds: 300
    protectedKinds:
    - Namespace
    - CustomResourceDefinition
    - PersistentVolume
    - PersistentVolumeClaim
    - StorageClass
    deletionAllowlist: []
