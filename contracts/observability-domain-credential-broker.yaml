apiVersion: delivery.re8ch.com/v1alpha1
kind: ReleaseContract
metadata:
  name: observability-domain-credential-broker
spec:
  authorityDomain: observability-metering
  target:
    cluster: re8ch
    namespace: credential-broker
  source:
    renderer: kustomize
    revision: github-main-reviewed
    repository: siren-observer/observability-gitops
    path: releases/observability-domain-credential-broker
  provenance:
    repository: siren-observer/observability-gitops
    workflow: .github/workflows/static-release.yml
    ref: refs/heads/main
    environment: release-executor-observability-metering
    audience: https://kube-api.re8ch.com/release-executor-observability-metering
    signer: https://github.com/siren-observer/observability-gitops/.github/workflows/static-release.yml@refs/heads/main
    issuer: https://token.actions.githubusercontent.com
  authorization:
    fieldManager: re8ch-release/observability-domain-credential-broker
    resources:
    - rbac.authorization.k8s.io/Role
    - rbac.authorization.k8s.io/RoleBinding
    objectNames:
    - harbor-supply-chain-credentials
    allowClusterScoped: false
    forceConflictObjects:
    - rbac.authorization.k8s.io/Role/credential-broker/harbor-supply-chain-credentials
    - rbac.authorization.k8s.io/RoleBinding/credential-broker/harbor-supply-chain-credentials
  inventory:
    digest: sha256:6a741c5c17a9ecca8d22971ed4f2e4103bf7fcd18a1b879a9ccec1c10aacec64
  lifecycle:
    prune: false
    healthTimeoutSeconds: 300
    protectedKinds:
    - Namespace
    - CustomResourceDefinition
    - PersistentVolume
    - PersistentVolumeClaim
    - StorageClass
    deletionAllowlist: []
